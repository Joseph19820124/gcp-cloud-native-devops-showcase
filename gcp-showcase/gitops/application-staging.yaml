apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: showcase-staging
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Joseph19820124/gcp-cloud-native-devops-showcase
    targetRevision: main
    path: gcp-showcase/k8s/overlays/staging
  destination:
    server: https://kubernetes.default.svc
    namespace: showcase-staging
  syncPolicy:
    automated:
      prune: true # delete resources removed from git
      selfHeal: true # revert manual drift back to git
    syncOptions:
      - CreateNamespace=true
