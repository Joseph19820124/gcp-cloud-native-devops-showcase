name: Service Pipeline

on:
  push:
    branches: [main]
    paths:
      - "gcp-showcase/app/**"
      - ".github/workflows/service-pipeline.yml"
  pull_request:
    paths:
      - "gcp-showcase/app/**"

env:
  GCP_REGION: us-central1
  GCP_PROJECT: ${{ vars.GCP_PROJECT }}
  WORKDIR: gcp-showcase

permissions:
  id-token: write # required for Workload Identity Federation
  contents: read

jobs:
  # Detect which service actually changed so we only build/push that one.
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'gcp-showcase/app/backend/**'
            frontend:
              - 'gcp-showcase/app/frontend/**'

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKDIR }}/app/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest -v

  build-and-scan:
    needs: [test, changes]
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.meta.outputs.tag }}
    defaults:
      run:
        working-directory: ${{ env.WORKDIR }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      # Build only the service(s) that changed.
      - name: Build backend
        if: needs.changes.outputs.backend == 'true'
        run: docker build --build-arg APP_VERSION=${{ steps.meta.outputs.tag }} -t backend:${{ steps.meta.outputs.tag }} app/backend
      - name: Build frontend
        if: needs.changes.outputs.frontend == 'true'
        run: docker build -t frontend:${{ steps.meta.outputs.tag }} app/frontend

      - name: Scan backend with Trivy
        if: needs.changes.outputs.backend == 'true'
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: backend:${{ steps.meta.outputs.tag }}
          severity: "CRITICAL,HIGH"
          exit-code: "0" # flip to "1" to fail the build on findings once triaged
      - name: Scan frontend with Trivy
        if: needs.changes.outputs.frontend == 'true'
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: frontend:${{ steps.meta.outputs.tag }}
          severity: "CRITICAL,HIGH"
          exit-code: "0"

      # Push only the changed service(s), and only on real pushes (not PRs).
      - name: Authenticate to Google Cloud (WIF)
        if: github.event_name != 'pull_request' && (needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true')
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}
      - name: Configure Docker for Artifact Registry
        if: github.event_name != 'pull_request' && (needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true')
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet
      - name: Push backend
        if: github.event_name != 'pull_request' && needs.changes.outputs.backend == 'true'
        run: |
          REG=${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT }}/showcase-dev
          docker tag backend:${{ steps.meta.outputs.tag }} $REG/backend:${{ steps.meta.outputs.tag }}
          docker push $REG/backend:${{ steps.meta.outputs.tag }}
      - name: Push frontend
        if: github.event_name != 'pull_request' && needs.changes.outputs.frontend == 'true'
        run: |
          REG=${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT }}/showcase-dev
          docker tag frontend:${{ steps.meta.outputs.tag }} $REG/frontend:${{ steps.meta.outputs.tag }}
          docker push $REG/frontend:${{ steps.meta.outputs.tag }}

  # GitOps: write the new image tag back to git. Argo CD (running in the
  # cluster) sees the commit and syncs — CI never touches the cluster.
  update-manifests:
    needs: [build-and-scan, changes]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && (needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install kustomize
        run: |
          curl -sSLo kustomize.tar.gz https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz
          tar xzf kustomize.tar.gz && sudo mv kustomize /usr/local/bin/
      - name: Bump changed image tags in the dev overlay
        working-directory: gcp-showcase/k8s/overlays/dev
        run: |
          REG=${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT }}/showcase-dev
          TAG=${{ needs.build-and-scan.outputs.image-tag }}
          [ "${{ needs.changes.outputs.backend }}" = "true" ]  && kustomize edit set image backend=$REG/backend:$TAG
          [ "${{ needs.changes.outputs.frontend }}" = "true" ] && kustomize edit set image frontend=$REG/frontend:$TAG
          true
      - name: Commit & push the tag bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gcp-showcase/k8s/overlays/dev/kustomization.yaml
          git diff --cached --quiet && { echo "no tag change"; exit 0; }
          git commit -m "chore(deploy): bump dev image tag to ${{ needs.build-and-scan.outputs.image-tag }} [skip ci]"
          git push
